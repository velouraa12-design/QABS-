name: QABS Preview Build and Deploy

on:
  push:
    branches:
      - preview/workspace-reference-layout
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qabs-preview-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: TypeScript validation
        run: npm run lint

      - name: Workspace route validation
        run: npm run check:routes

      - name: Build static site
        run: npm run build

      - name: Scan source for accidental secrets
        shell: bash
        run: |
          if grep -rnE 'sk_live_[A-Za-z0-9]+' src/ || grep -rnE 'AKIA[0-9A-Z]{16}' src/; then
            echo "Potential live credential found in source."
            exit 1
          fi

      - name: Deploy to isolated Cloudflare Pages preview
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d1c24135f8b8eb634e49ae26346090ea
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          npx --yes wrangler@latest pages deploy dist --project-name=qabs-workspace-reference-preview --branch=preview
