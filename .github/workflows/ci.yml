name: QABS Platform CI & Quality Check

on:
  push:
    branches: [ main, master, 'autonomous/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node.js Environment
      uses: actions/setup-node@v7
      with:
        node-version: 22
        package-manager-cache: false

    - name: Install Dependencies
      run: npm install --ignore-scripts --legacy-peer-deps

    - name: Report dependency advisories (non-blocking)
      run: |
        npm audit --json > /tmp/qabs-npm-audit.json || true
        npm audit --omit=dev --json > /tmp/qabs-prod-audit.json || true
        node --input-type=module -e '
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("/tmp/qabs-npm-audit.json", "utf8"));
          const prodReport = JSON.parse(fs.readFileSync("/tmp/qabs-prod-audit.json", "utf8"));
          const vulnerabilities = Object.entries(report.vulnerabilities || {});
          const productionVulnerabilities = Object.entries(prodReport.vulnerabilities || {});
          console.log("Full dependency audit:", JSON.stringify(report.metadata?.vulnerabilities || {}));
          console.log("Production-only dependency audit:", JSON.stringify(prodReport.metadata?.vulnerabilities || {}));
          for (const [name, item] of vulnerabilities) {
            const via = (item.via || []).map(advisory =>
              typeof advisory === "string"
                ? advisory
                : `${advisory.title} [${advisory.url || "no advisory URL"}; affected=${advisory.range || "see advisory"}]`
            ).join("; ");
            console.log(`AUDIT ${item.severity}: ${name}; range=${item.range}; fixAvailable=${JSON.stringify(item.fixAvailable)}; advisories=${via}`);
          }
          for (const [name, item] of productionVulnerabilities) {
            console.log(`PRODUCTION AUDIT ${item.severity}: ${name}; range=${item.range}`);
          }
          if (!vulnerabilities.length) console.log("npm audit: no package advisories reported.");
          if (!productionVulnerabilities.length) console.log("Production-only audit: no package advisories reported.");
        '

    - name: Run TypeScript & Lint Checks
      run: npm run lint

    - name: Run API & Route Contract Tests
      run: npm test

    - name: Verify workspace routes
      run: npm run check:routes

    - name: Build Application Bundle
      run: npm run build

    - name: Build isolated Node preview container
      run: docker build --pull -t qabs-preview:ci .

    - name: Start isolated API container for smoke tests
      run: |
        docker run -d --name qabs-preview-ci -p 3000:3000 \
          -e NODE_ENV=production \
          -e QABS_DB_PATH=/tmp/qabs-ci.sqlite \
          -e QABS_ALLOW_SANDBOX_PAYMENTS=false \
          -e APP_ORIGIN=https://preview.example.test \
          qabs-preview:ci

    - name: Smoke-test container health, auth and disabled payments
      run: |
        for attempt in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:3000/api/health > /tmp/qabs-health.json; then
            break
          fi
          sleep 2
        done
        node --input-type=module -e '
          import fs from "node:fs";
          const health = JSON.parse(fs.readFileSync("/tmp/qabs-health.json", "utf8"));
          if (health.status !== "ok" || health.paymentsEnabled !== false) process.exit(1);
        '
        curl -fsS http://127.0.0.1:3000/api/auth/session | node --input-type=module -e '
          let body = ""; for await (const chunk of process.stdin) body += chunk;
          const session = JSON.parse(body);
          if (session.authenticated !== false || session.user !== null) process.exit(1);
        '
        curl -fsS http://127.0.0.1:3000/studio/api/config | node --input-type=module -e '
          let body = ""; for await (const chunk of process.stdin) body += chunk;
          const config = JSON.parse(body);
          if (config.stage !== "preview-isolated" || config.payments !== false) process.exit(1);
        '
        # Exercise a complete synthetic registration/session/CSRF/logout lifecycle.
        curl -fsS -c /tmp/qabs-cookies.txt -H 'Content-Type: application/json' \
          -d '{"name":"CI Customer","email":"ci-customer@example.test","companyName":"CI Workspace","password":"Qabs-CI-Strong-2026!","role":"super_admin"}' \
          http://127.0.0.1:3000/api/auth/register > /tmp/qabs-register.json
        node --input-type=module -e '
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync("/tmp/qabs-register.json", "utf8"));
          if (!result.ok || !result.authenticated || result.user?.role !== "customer" || !result.csrfToken) {
            throw new Error("Registration/session contract failed");
          }
          fs.writeFileSync("/tmp/qabs-csrf.txt", result.csrfToken);
        '
        curl -fsS -b /tmp/qabs-cookies.txt http://127.0.0.1:3000/api/auth/session | node --input-type=module -e '
          let body = ""; for await (const chunk of process.stdin) body += chunk;
          const session = JSON.parse(body);
          if (!session.authenticated || session.user?.email !== "ci-customer@example.test") process.exit(1);
        '
        # Verify tenant isolation against the real packaged production server.
        csrf="$(cat /tmp/qabs-csrf.txt)"
        curl -fsS -b /tmp/qabs-cookies.txt -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' \
          -d '{"serviceSlug":"ein","serviceTitleAr":"طلب EIN اختباري","serviceTitleEn":"CI EIN Request","customerName":"CI Customer","customerEmail":"ci-customer@example.test","customerPhone":"+10000000000","status":"draft"}' \
          http://127.0.0.1:3000/api/service-requests > /tmp/qabs-request.json
        node --input-type=module -e '
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync("/tmp/qabs-request.json", "utf8"));
          if (!data.request?.id || data.request.status !== "draft") throw new Error("Tenant A request creation failed");
          fs.writeFileSync("/tmp/qabs-request-id.txt", data.request.id);
        '
        curl -fsS -c /tmp/qabs-beta-cookies.txt -H 'Content-Type: application/json' \
          -d '{"name":"CI Tenant Beta","email":"ci-beta@example.test","companyName":"CI Beta Workspace","password":"Qabs-CI-Strong-2026!"}' \
          http://127.0.0.1:3000/api/auth/register > /tmp/qabs-beta-register.json
        node --input-type=module -e '
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync("/tmp/qabs-beta-register.json", "utf8"));
          if (!data.authenticated || data.user?.role !== "customer" || !data.csrfToken) throw new Error("Tenant B registration failed");
          fs.writeFileSync("/tmp/qabs-beta-csrf.txt", data.csrfToken);
        '
        request_id="$(cat /tmp/qabs-request-id.txt)"
        cross_status="$(curl -sS -o /tmp/qabs-cross-tenant.json -w '%{http_code}' -b /tmp/qabs-beta-cookies.txt "http://127.0.0.1:3000/api/service-requests/$request_id")"
        test "$cross_status" = "403"
        curl -fsS -b /tmp/qabs-beta-cookies.txt http://127.0.0.1:3000/api/service-requests | node --input-type=module -e '
          let body = ""; for await (const chunk of process.stdin) body += chunk;
          if (JSON.parse(body).requests?.length !== 0) process.exit(1);
        '
        admin_status="$(curl -sS -o /tmp/qabs-admin-denied.json -w '%{http_code}' -b /tmp/qabs-beta-cookies.txt http://127.0.0.1:3000/api/admin/overview)"
        test "$admin_status" = "403"

        curl -fsS -b /tmp/qabs-cookies.txt -H "X-CSRF-Token: $csrf" -X POST \
          http://127.0.0.1:3000/api/auth/logout | node --input-type=module -e '
          let body = ""; for await (const chunk of process.stdin) body += chunk;
          if (JSON.parse(body).authenticated !== false) process.exit(1);
        '
        curl -fsS -b /tmp/qabs-cookies.txt http://127.0.0.1:3000/api/auth/session | node --input-type=module -e '
          let body = ""; for await (const chunk of process.stdin) body += chunk;
          if (JSON.parse(body).authenticated !== false) process.exit(1);
        '

    - name: Stop isolated API container
      if: always()
      run: docker rm -f qabs-preview-ci || true

    - name: Security & Secret Scan
      run: |
        echo "Running zero-leak secrets audit..."
        if grep -rn "sk_live_" src/ || grep -rn "AKIA[0-9A-Z]" src/; then
          echo "ERROR: Discovered live secret in codebase!"
          exit 1
        fi
        echo "Basic secret-pattern scan passed; this is not a complete security audit."
