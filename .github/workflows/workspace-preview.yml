name: Validate QABS isolated workspace preview

on:
  push:
    branches:
      - preview/workspace-reference-layout
      - unified-template-preview-20261116
      - chore/qabs-123-unified-completion
  pull_request:
    branches:
      - main
      - chore/qabs-123-unified-completion
  workflow_dispatch:

# Build and test only. No Cloudflare credentials, deployment, DNS, or external service writes.
permissions:
  contents: read

concurrency:
  group: qabs-preview-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript checks
        run: npm run lint

      - name: API, authentication and tenant-isolation tests
        run: npm test

      - name: Workspace route contract
        run: npm run check:routes

      - name: Production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qabs-workspace-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3
