name: Build and deploy QABS isolated workspace preview
on:
  pull_request:
    branches:
      - integration/qabs-unified-preview-20261118
    paths:
      - '.github/workflows/workspace-preview.yml'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'scripts/**'
      - 'tests/**'
  push:
    branches:
      - preview/workspace-reference-layout
      - unified-template-preview-20261116
      - chore/qabs-123-unified-completion
      - integration/qabs-unified-preview-20261118
      - fix/cloudflare-preview-secret-condition-20261118
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run TypeScript & Lint Checks
        run: npm run lint
      - name: Run API & Route Contract Tests
        run: npm test
      - name: Verify workspace routes
        run: npm run check:routes
      - name: Build static site
        run: npm run build
      - name: Exclude AI Studio access-history artifacts from public preview
        run: |
          find dist -type f -path '*/aistudio/applet_access_history_*.json' -delete
          if find dist -type f -path '*/aistudio/applet_access_history_*.json' -print -quit | grep -q .; then
            echo "::error::AI Studio access-history artifacts must not be published in the preview."
            exit 1
          fi
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: qabs-workspace-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3
      - name: Detect Cloudflare deployment credential
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to isolated Cloudflare Pages project
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d1c24135f8b8eb634e49ae26346090ea
        run: |
          npx wrangler pages deploy dist --project-name=qabs-workspace-reference-preview --branch=${GITHUB_REF_NAME}
      - name: Report missing Cloudflare token (non-blocking)
        if: steps.cloudflare.outputs.configured == 'false'
        run: |
          echo "CLOUDFLARE_API_TOKEN is not configured in GitHub repository secrets; skipped remote Cloudflare Pages publish. Build artifact uploaded cleanly."
