name: Build and deploy QABS isolated workspace preview
on:
  push:
    branches:
      - preview/workspace-reference-layout
      - unified-template-preview-20261116
      - autonomous/qabs-baseline-audit-20261118
      - chore/qabs-123-unified-completion
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d1c24135f8b8eb634e49ae26346090ea
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run TypeScript & Lint Checks
        run: npm run lint
      - name: Run API & Route Contract Tests
        run: npm test
      - name: Verify workspace routes
        run: npm run check:routes
      - name: Build static site
        run: npm run build
      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: qabs-workspace-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3
      - name: Deploy to isolated Cloudflare Pages project
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npx wrangler pages deploy dist --project-name=qabs-workspace-reference-preview --branch=${GITHUB_REF_NAME}
      - name: Smoke-test isolated Studio API bridge
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          preview_url="https://studio-preview.qabs1.store" # Stable alias of the isolated Pages project production deployment
          for attempt in $(seq 1 20); do
            if curl -fsS "$preview_url/studio/api/config" -o /tmp/qabs-studio-config.json; then
              break
            fi
            sleep 3
          done
          node --input-type=module -e '
            import fs from "node:fs";
            const config = JSON.parse(fs.readFileSync("/tmp/qabs-studio-config.json", "utf8"));
            if (config.emailVerification !== false || config.payments !== false || config.passwordRecovery !== false) {
              throw new Error("Studio preview config safety contract failed");
            }
          '
          auth_status="$(curl -sS -o /tmp/qabs-studio-unauth.json -w '%{http_code}' "$preview_url/studio/api/me")"
          test "$auth_status" = "401"
          origin_status="$(curl -sS -o /tmp/qabs-studio-origin.json -w '%{http_code}' \
            -X POST -H 'Origin: https://attacker.invalid' -H 'Content-Type: application/json' \
            -d '{}' "$preview_url/studio/api/project-workspaces")"
          test "$origin_status" = "403"
          grep -q 'origin_rejected' /tmp/qabs-studio-origin.json
      - name: Report missing Cloudflare token (non-blocking)
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN is not configured in GitHub repository secrets; skipped remote Cloudflare Pages publish. Build artifact uploaded cleanly."
